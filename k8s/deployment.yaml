apiVersion: v1
kind: ConfigMap
metadata:
  name: helloworld-html
  namespace: helloworld
  labels:
    app.kubernetes.io/name: helloworld
    backstage.io/kubernetes-id: helloworld
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="fr">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>helloworld — IDP Golden Path (dev)</title>
      <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: #0f172a;
          color: #f8fafc;
          margin: 0;
          padding: 40px 20px;
          display: flex;
          justify-content: center;
        }
        .card {
          max-width: 760px;
          width: 100%;
          background: #1e293b;
          border: 1px solid #334155;
          border-radius: 16px;
          padding: 32px;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .badge {
          display: inline-block;
          background: #10b981;
          color: #064e3b;
          font-weight: 700;
          padding: 4px 12px;
          border-radius: 9999px;
          font-size: 0.85rem;
          text-transform: uppercase;
        }
        h1 { margin: 16px 0 8px; font-size: 2rem; }
        p { color: #94a3b8; line-height: 1.6; }
        .grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 16px;
          margin-top: 24px;
        }
        .box {
          background: #0f172a;
          border: 1px solid #334155;
          border-radius: 12px;
          padding: 16px;
        }
        .box h3 { margin: 0 0 8px; font-size: 0.9rem; color: #38bdf8; }
        .box code { font-size: 0.85rem; color: #e2e8f0; word-break: break-all; }
      </style>
    </head>
    <body>
      <div class="card">
        <span class="badge">Environnement dev • Actif</span>
        <h1>🚀 Hello World from helloworld!</h1>
        <p>Application Hello World Golden Path déployée sur EKS Spoke avec S3 et RDS PostgreSQL via Crossplane</p>
        <div class="grid">
          <div class="box">
            <h3>Cluster EKS Spoke</h3>
            <code>idp-platform-dev-eks (948025766648)</code>
          </div>
          <div class="box">
            <h3>Ingress HTTPS (ALB + Traefik)</h3>
            <code>https://helloworld.dev.dsery.me</code>
          </div>
          <div class="box">
            <h3>Bucket S3 (Crossplane)</h3>
            <code>helloworld-dev-assets-948025766648</code>
          </div>
          <div class="box">
            <h3>RDS PostgreSQL 16 (Crossplane)</h3>
            <code>helloworld-dev-db (db.t4g.micro)</code>
          </div>
        </div>
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld
  namespace: helloworld
  labels:
    app.kubernetes.io/name: helloworld
    app.kubernetes.io/env: dev
    backstage.io/kubernetes-id: helloworld
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: helloworld
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helloworld
        app.kubernetes.io/env: dev
        backstage.io/kubernetes-id: helloworld
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: helloworld-html
