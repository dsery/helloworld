apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helloworld
  namespace: helloworld
  labels:
    app.kubernetes.io/name: helloworld
    backstage.io/kubernetes-id: helloworld
  annotations:
    # L'ALB Spoke (dev) assure la terminaison TLS ACM et transfère en HTTP vers l'entrypoint "web" de Traefik
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  ingressClassName: traefik
  rules:
    - host: helloworld.dev.dsery.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helloworld
                port:
                  number: 80
